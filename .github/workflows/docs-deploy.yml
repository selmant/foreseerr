---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      - 'gen-docs/**'
      - 'seerr-api.yml'
      - '.github/workflows/docs-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: gen-docs
        run: bun install --frozen-lockfile

      - name: Build website
        working-directory: gen-docs
        run: bun run gen-api-docs && bun run build

      # Jellyfin's plugin repository URL. The newest plugin release carries
      # the manifest; jellyfin-plugin-release.yml runs this workflow after
      # publishing one.
      - name: Add Jellyfin plugin repository manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("jellyfin-plugin-v"))][0] // ""')"
          if [[ -z "$tag" ]]; then
            echo "::warning::No Jellyfin plugin release to serve"
            exit 0
          fi
          mkdir -p gen-docs/build/jellyfin
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern foreseerr-jellyfin-manifest.json \
            --output gen-docs/build/jellyfin/manifest.json
          jq -e '.[0].versions | length > 0' gen-docs/build/jellyfin/manifest.json >/dev/null

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b6 # v4.0.0
        with:
          path: gen-docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
