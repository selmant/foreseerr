name: Jellyfin plugin
on:
  pull_request:
    paths:
      - 'plugin/**'
      - 'plugin.tests/**'
      - 'server/**'
      - 'src/**'
      - 'scripts/*plugin*'
      - 'scripts/compile.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/jellyfin-plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: ['10.11', '12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: bun install --frozen-lockfile
      - run: dotnet test plugin.tests/Foreseerr.Jellyfin.Tests.csproj -c Release -p:JellyfinTarget=${{ matrix.abi }}
      - run: bun run test server/lib/pluginMode.test.ts server/lib/jellyfinHostBootstrap.test.ts server/routes/auth.test.ts
      - run: bun run compile:plugin -- bun-linux-x64
      - run: plugin/build.sh '${{ matrix.abi }}' linux-x64
      - run: bun scripts/prove-jellyfin-plugin.mjs '${{ matrix.abi }}'
