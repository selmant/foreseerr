---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Attaches the Foreseerr desktop app (selmant/foreseerr-player, built from its
# main) to a Foreseerr release, as foreseerr-desktop-linux-x64.tar.gz with its
# checksum. release.yml runs this for each release before publishing it; run
# it by hand to add the app to a release that is already out (its
# SHA256SUMS is then updated too).
name: Desktop app

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # The app's own repository: it follows its main on purpose, so each
    # release ships the app as it is then.
    uses: selmant/foreseerr-player/.github/workflows/build.yml@main
    with:
      ref: main
      version: ${{ inputs.tag }}

  attach:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x64
          path: app

      - name: Upload it
        run: |
          set -euo pipefail
          cd app
          mv ./*.tar.gz foreseerr-desktop-linux-x64.tar.gz
          sha256sum foreseerr-desktop-linux-x64.tar.gz > foreseerr-desktop-linux-x64.tar.gz.sha256
          gh release upload "$TAG" foreseerr-desktop-linux-x64.tar.gz \
            foreseerr-desktop-linux-x64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

      # A draft gets its SHA256SUMS when release.yml publishes it.
      - name: Update SHA256SUMS of a published release
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$draft" == "true" ]]; then
            exit 0
          fi
          mkdir sums && cd sums
          gh release download "$TAG" --pattern '*.sha256' --repo "$GITHUB_REPOSITORY"
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
