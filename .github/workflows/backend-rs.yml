---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Rust backend

on:
  pull_request:
    paths:
      - 'backend-rs/**'
      # Compiled or read in from outside the crate.
      - 'package.json'
      - 'seerr-api.yml'
      # The generators and the Node side of the comparisons run on these.
      - 'bun.lock'
      - '.bun-version'
      # The locales are compiled in; the rest (entities, migrations, settings
      # defaults, routes, jobs) is mirrored by hand, so a Node change there
      # can break parity without touching the crate.
      - 'server/**'
      - '.github/workflows/backend-rs.yml'
  push:
    branches:
      - develop
    paths:
      - 'backend-rs/**'
      # Compiled or read in from outside the crate.
      - 'package.json'
      - 'seerr-api.yml'
      # The generators and the Node side of the comparisons run on these.
      - 'bun.lock'
      - '.bun-version'
      # The locales are compiled in; the rest (entities, migrations, settings
      # defaults, routes, jobs) is mirrored by hand, so a Node change there
      # can break parity without touching the crate.
      - 'server/**'
      - '.github/workflows/backend-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      # Also the SQLite startup smoke. The database it leaves, with both
      # mapping datasets downloaded, is the scratch database
      # src/mappinglayer/dbtests.rs needs; under CI that test fails
      # instead of skipping without one.
      - name: Build the scratch mapping database
        run: python3 scripts/ci-smoke.py --bin target/debug/foreseerr --mapping-db "$RUNNER_TEMP/mapping.sqlite3"

      - name: Test
        run: FORESEERR_MAPPING_TEST_DB="$RUNNER_TEMP/mapping.sqlite3" cargo test --locked

  generated:
    name: Generated code matches Node
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        env:
          CI: true
        run: bun install --frozen-lockfile

      # The validator route table (seerr-api.yml), the migrations (TypeORM's
      # server/migration) and the dev-mode synchronize DDL (server/entity)
      # are generated from the Node sources; a change there must come with
      # regenerated Rust copies.
      - name: Regenerate
        run: |
          bun backend-rs/scripts/gen-api-routes.ts "$PWD" "$PWD/backend-rs"
          bun backend-rs/scripts/gen-migrations.ts "$PWD" "$PWD/backend-rs"
          bun backend-rs/scripts/gen-synchronize.ts "$PWD" "$PWD/backend-rs"

      - name: Fail on drift
        run: |
          changes=$(git status --porcelain -- backend-rs)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- backend-rs
            echo "::error::The generated Rust copies are out of date. Run backend-rs/scripts/gen-*.ts (see their headers) and commit the result."
            exit 1
          fi

  validator-diff:
    name: Validator differential test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        working-directory: backend-rs
        run: rustup toolchain install

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        env:
          CI: true
        run: bun install --frozen-lockfile

      # Records express-openapi-validator's answers to the generated corpus,
      # then replays it through the Rust validator (the ignored openapi_
      # tests, which fail under CI without a corpus).
      - name: Compare with express-openapi-validator
        run: backend-rs/scripts/openapi-diff.sh "$RUNNER_TEMP/openapi/corpus.jsonl"

  postgres:
    name: Startup and migrations on Postgres 18
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foreseerr
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: foreseerr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foreseerr -d foreseerr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --locked

      # Fresh database: every shipped migration applies, in order; the
      # authenticated reads answer; a restart applies nothing new.
      - name: Smoke test
        env:
          DB_TYPE: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: foreseerr
          DB_PASS: ci-password
          DB_NAME: foreseerr
          DB_USE_SSL: 'false'
        run: python3 scripts/ci-smoke.py --bin target/debug/foreseerr

  compare:
    name: Node and Rust answer alike
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        working-directory: backend-rs
        run: rustup toolchain install

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        env:
          CI: true
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: backend-rs
        run: cargo build --locked

      # Both backends on fresh SQLite databases with the same seed rows and
      # the same scripted requests, including the review's failure and
      # concurrency cases (KNOWN_GAPS in the script lists the open ones).
      - name: Compare
        run: python3 backend-rs/scripts/ci-compare.py --bin backend-rs/target/debug/foreseerr
