---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Rust backend

on:
  pull_request:
    paths:
      - 'backend-rs/**'
      - 'Dockerfile'
      - 'Dockerfile.rust'
      - '.dockerignore'
      - 'vite.config.ts'
      # Compiled or read in from outside the crate.
      - 'package.json'
      - 'seerr-api.yml'
      # The route table generator and the frontend build run on these.
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/backend-rs.yml'
  push:
    branches:
      - develop
    paths:
      - 'backend-rs/**'
      - 'Dockerfile'
      - 'Dockerfile.rust'
      - '.dockerignore'
      - 'vite.config.ts'
      # Compiled or read in from outside the crate.
      - 'package.json'
      - 'seerr-api.yml'
      # The route table generator and the frontend build run on these.
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/backend-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      # Also the SQLite startup smoke. The database it leaves, with both
      # mapping datasets downloaded, is the scratch database
      # src/mappinglayer/dbtests.rs needs; under CI that test fails
      # instead of skipping without one.
      - name: Build the scratch mapping database
        run: python3 scripts/ci-smoke.py --bin target/debug/foreseerr --mapping-db "$RUNNER_TEMP/mapping.sqlite3"

      - name: Test
        run: FORESEERR_MAPPING_TEST_DB="$RUNNER_TEMP/mapping.sqlite3" cargo test --locked

  api-routes:
    name: API route table matches seerr-api.yml
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The fallback's route table (src/standalone/apiroutes.rs) is generated
      # from seerr-api.yml; a spec change must come with a regenerated copy.
      # The generator needs only Bun, no node_modules.
      - name: Regenerate
        run: bun backend-rs/scripts/gen-api-routes.ts "$PWD" "$PWD/backend-rs"

      - name: Fail on drift
        run: |
          changes=$(git status --porcelain -- backend-rs)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- backend-rs
            echo "::error::src/standalone/apiroutes.rs is out of date. Run backend-rs/scripts/gen-api-routes.ts (see its header) and commit the result."
            exit 1
          fi

  postgres:
    name: Startup and migrations on Postgres 18
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foreseerr
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: foreseerr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foreseerr -d foreseerr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --locked

      # Fresh database: every shipped migration applies, in order; the
      # authenticated reads answer; a restart applies nothing new.
      - name: Smoke test
        env:
          DB_TYPE: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: foreseerr
          DB_PASS: ci-password
          DB_NAME: foreseerr
          DB_USE_SSL: 'false'
        run: python3 scripts/ci-smoke.py --bin target/debug/foreseerr

      - name: Standalone regressions
        env:
          DB_TYPE: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: foreseerr
          DB_PASS: ci-password
          DB_NAME: foreseerr
          DB_USE_SSL: 'false'
        run: python3 scripts/ci-standalone.py --bin target/debug/foreseerr

  standalone-web:
    name: Standalone with the built frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        working-directory: backend-rs
        run: rustup toolchain install

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        env:
          CI: true
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: backend-rs
        run: cargo build --locked

      - name: Build the frontend and API docs assets
        run: bun run build:web

      # SQLite; the Postgres job runs the same script without the frontend.
      - name: Standalone regressions without node_modules in the app root
        run: python3 backend-rs/scripts/ci-standalone.py --bin backend-rs/target/debug/foreseerr --require-web
