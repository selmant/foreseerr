---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Create tag

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-tag-version:
    name: Determine tag version
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_version: ${{ steps.git-cliff.outputs.tag_version }}
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              fetch-depth: 0
              persist-credentials: false

          - name: Install git-cliff
            uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
            with:
              tool: git-cliff

      - name: Get tag version
        id: git-cliff
        env:
          # In order to avoid hitting the GitHub API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_version=$(git-cliff -c .github/cliff.toml --bumped-version --unreleased)
          echo "Next tag version is ${tag_version}"
          echo "tag_version=${tag_version}" >> "$GITHUB_OUTPUT"

  create-tag:
    name: Create tag
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: determine-tag-version
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_VERSION: ${{ needs.determine-tag-version.outputs.tag_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: '${{ secrets.COMMIT_KEY }}'

      - parallel:
          - name: Set up Bun
            uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            with:
              bun-version-file: .bun-version

          - name: Configure git
            run: |
              git config --global user.name "${{ github.actor }}"
              git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Bump release versions
        run: |
          version="${TAG_VERSION#v}"
          bun pm pkg set version="$version"
          sed -i "s/^version:.*/version: ${version}/" charts/foreseerr-chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: '${TAG_VERSION}'/" charts/foreseerr-chart/Chart.yaml
          bun scripts/check-version-consistency.mjs "${TAG_VERSION}"

      - name: Commit updated files
        run: |
          git add package.json charts/foreseerr-chart/Chart.yaml
          git commit -m "chore(release): prepare ${TAG_VERSION}"
          git push

      - name: Create git tag
        run: |
          git tag ${TAG_VERSION}
          git push origin ${TAG_VERSION}
