---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Migrate GHCR package name

# One-shot helper after renaming selmant/seerr -> selmant/foreseerr.
# Copies existing image tags to the new package path, then can be deleted.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: Comma-separated tags to copy from ghcr.io/selmant/seerr
        required: true
        default: 'v0.1.0-alpha.6,v0.1.0-alpha.5,v0.1.0-alpha.4,v0.1.0-alpha.3'

permissions:
  contents: read
  packages: write

jobs:
  copy-tags:
    name: Copy GHCR tags to foreseerr
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          set -euo pipefail
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      - name: Copy tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -n "$tag" ] || continue
            echo "Copying ghcr.io/selmant/seerr:$tag -> ghcr.io/selmant/foreseerr:$tag"
            if ! crane copy "ghcr.io/selmant/seerr:$tag" "ghcr.io/selmant/foreseerr:$tag"; then
              echo "Skipping missing or failed tag: $tag" >&2
            fi
          done
